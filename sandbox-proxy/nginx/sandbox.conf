# =============================================================================
# Config de nginx para enrutar *.sandbox.awslearn.cloud -> sandbox-proxy
#
# Hay DOS variantes. Elegir UNA según cómo se maneje el TLS wildcard.
# El resto del nginx (rentix, etc.) NO se toca: esto es aditivo.
# =============================================================================

# -----------------------------------------------------------------------------
# VARIANTE A (recomendada): nginx TERMINA el TLS wildcard y hace proxy HTTP
# al contenedor en 127.0.0.1:8443. Requiere un certificado wildcard
# *.sandbox.awslearn.cloud instalado en el host (certbot DNS-01 / Route53).
#
# En este caso el proxy Node corre en HTTP (sin TLS_CERT/TLS_KEY).
# Colocar este archivo en /etc/nginx/conf.d/ (contexto http).
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?<label>[a-z0-9-]+)\.sandbox\.awslearn\.cloud$;

    # Cert wildcard emitido con DNS-01 (ej. certbot --dns-route53 -d '*.sandbox.awslearn.cloud')
    ssl_certificate     /etc/letsencrypt/live/sandbox.awslearn.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.awslearn.cloud/privkey.pem;

    # code-server usa WebSocket: hay que propagar Upgrade/Connection.
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                 # el proxy Node lee el label del Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;                    # sesiones largas de code-server
        proxy_send_timeout 3600s;
    }
}

# -----------------------------------------------------------------------------
# VARIANTE B: passthrough SNI (nginx NO ve el TLS; el proxy Node termina TLS).
# Requiere el módulo `stream` y que el proxy corra con TLS_CERT/TLS_KEY.
# Va en el contexto `stream { }` del nginx.conf (NO en conf.d http).
#
# OJO: no se puede compartir el :443 entre http y stream en la misma IP.
# Esta variante solo aplica si el :443 se dedica a stream, lo cual chocaría
# con los sitios http existentes. Por eso se recomienda la VARIANTE A.
#
# stream {
#     map $ssl_preread_server_name $backend {
#         ~^[a-z0-9-]+\.sandbox\.awslearn\.cloud$   127.0.0.1:8443;
#     }
#     server {
#         listen 8444;              # puerto dedicado, NO el 443 de los sitios http
#         ssl_preread on;
#         proxy_pass $backend;
#     }
# }
# -----------------------------------------------------------------------------
